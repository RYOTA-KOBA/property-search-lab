# property_dev は reference/schema.sql が正のスキーマで、マイグレーションでは管理しない
# (docs/decisions.md 参照)。.env の MYSQL_* を通じて docker-compose の mysql サービスに繋ぐ
default: &default
  adapter: mysql2
  encoding: utf8mb4
  username: <%= ENV.fetch("MYSQL_USER") %>
  password: <%= ENV.fetch("MYSQL_PASSWORD") %>
  host: <%= ENV.fetch("MYSQL_HOST", "127.0.0.1") %>
  database: <%= ENV.fetch("MYSQL_DATABASE") %>

development:
  <<: *default

test:
  <<: *default
